# Roda em todo PR (para develop ou main) e em todo push na develop.
# "Pronto" aqui é o mesmo do .claude/verify.sh: typecheck, testes e build.
name: ci

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # A main só recebe o que passou pela develop.
  origem-develop:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: PR para main precisa vir da develop
        env:
          ORIGEM: ${{ github.head_ref }}
        run: |
          if [ "$ORIGEM" != "develop" ]; then
            echo "::error::PR para main só pode vir da develop (veio de '$ORIGEM')."
            exit 1
          fi
